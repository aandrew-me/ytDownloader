name: Build and Release
on:
    push:
        branches: [release]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    create_draft:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Create Draft Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Extract version directly from package.json
                  VERSION=$(node -p "require('./package.json').version")

                  # Create the draft. If it already exists (e.g., on workflow re-runs), fail gracefully without stopping the script.
                  gh release create "v${VERSION}" --draft --title "v${VERSION}" --notes "Automated build artifacts." || echo "Draft already exists, proceeding..."

    build_and_release:
        needs: create_draft
        runs-on: ${{ matrix.os }}
        env:
            SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        strategy:
            matrix:
                include:
                    - target: macos-arm64
                      os: macos-latest
                    - target: macos-intel
                      os: macos-26-intel
                    - target: linux-x64
                      os: ubuntu-latest
                    - target: windows-x64
                      os: windows-latest
                    - target: windows-arm64
                      os: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Node.js, NPM and Yarn
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Linux Build
              if: matrix.target == 'linux-x64'
              run: |
                  sudo snap install snapcraft --classic
                  wget "https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffmpeg_linux_amd64.tar.xz"
                  NODE_ARCHIVE=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | grep 'linux-x64\.tar\.xz$' | awk '{print $2}')
                  curl -fsSL "https://nodejs.org/dist/latest-v22.x/${NODE_ARCHIVE}" | tar -xJ --strip-components=2 --wildcards '*/bin/node'
                  chmod +x node
                  tar -xf ffmpeg_linux_amd64.tar.xz
                  mv ffmpeg_linux_amd64 ffmpeg
                  chmod +x ffmpeg/bin/ffmpeg
                  chmod +x ffmpeg/bin/ffprobe
                  patchelf --set-rpath '$ORIGIN/../lib' ffmpeg/bin/ffmpeg
                  patchelf --set-rpath '$ORIGIN/../lib' ffmpeg/bin/ffprobe
                  rm ffmpeg_linux_amd64.tar.xz
                  npm i
                  npm run gh-linux

            - name: Macos Intel Build
              if: matrix.target == 'macos-intel'
              run: |
                  mkdir -p ffmpeg/bin
                  curl -L https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffmpeg_macos_amd64 -o ffmpeg/bin/ffmpeg
                  curl -L https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffprobe_macos_amd64 -o ffmpeg/bin/ffprobe
                  chmod +x ffmpeg/bin/ffmpeg
                  chmod +x ffmpeg/bin/ffprobe
                  npm i
                  npm run gh-mac

            - name: Macos Arm Build
              if: matrix.target == 'macos-arm64'
              run: |
                  mkdir -p ffmpeg/bin
                  curl -L https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffmpeg_macos_amd64 -o ffmpeg/bin/ffmpeg
                  curl -L https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffprobe_macos_arm64 -o ffmpeg/bin/ffprobe
                  chmod +x ffmpeg/bin/ffmpeg
                  chmod +x ffmpeg/bin/ffprobe
                  npm i
                  npm run gh-mac

            - name: Windows x64 Build
              if: matrix.target == 'windows-x64'
              shell: powershell
              run: |
                  curl.exe -fsSL "https://nodejs.org/dist/latest-v22.x/win-x64/node.exe" -o node.exe
                  curl.exe -fsSL "https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffmpeg_win64.zip" -o ffmpeg_win64.zip
                  Expand-Archive -Path ffmpeg_win64.zip -DestinationPath .
                  Move-Item -Path .\ffmpeg_win64 -Destination .\ffmpeg
                  Remove-Item -Path ffmpeg_win64.zip
                  npm i
                  npm run gh-windows

            - name: Windows Arm64 Build
              if: matrix.target == 'windows-arm64'
              shell: powershell
              run: |
                  curl.exe -fsSL "https://nodejs.org/dist/latest-v22.x/win-arm64/node.exe" -o node.exe
                  curl.exe -fsSL "https://github.com/aandrew-me/ffmpeg-builds/releases/download/v8/ffmpeg_win_arm64.zip" -o ffmpeg_win_arm64.zip
                  Expand-Archive -Path ffmpeg_win_arm64.zip -DestinationPath .
                  Get-ChildItem -Directory -Filter "ffmpeg*" | ForEach-Object { Move-Item $_.FullName .\ffmpeg }
                  Remove-Item -Path ffmpeg_win_arm64.zip
                  npm i
                  npm run gh-windows-arm64